input_select:
  # Harmonogramy użytkowania pokoi (do konfiguracji przez użytkownika)
  # Format: "HH:MM-HH:MM" dla dni roboczych i weekendów
  # Przykład: "06:00-08:00,18:00-22:00|08:00-22:00"
  sypialnia_usage_schedule:
    name: "Sypialnia - Harmonogram"
    options:
      - "22:00-07:00|23:00-09:00"
      - "22:00-08:00|23:00-10:00"
      - "Brak"
